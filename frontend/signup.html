<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmaVision | Sign Up</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <link rel="icon" href="{{url_for('static', filename='img/logo.png')}}" type="image/x-icon">
</head>
<body>
  <div id="preloader"></div>

  <div class="hero">
    <div class="navbar-box">
      <nav class="navbar">
        <div class="logo">
          <a href="/">PharmaVision</a>
        </div>
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="navlinks">
          <a href="/" class="navlink">Home</a>
          <a href="/about" class="navlink">About Us</a>
          <a href="/signin" class="navlink">Sign In</a>
          <a href="/signup" class="navlink">Sign Up</a>
        </div>
      </nav>
    </div>

    <div class="contact-container">
      <h2>Create Account</h2>
      <form class="contact-form" action="/signup" method="POST">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" minlength="6" required>

        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" minlength="6" required>

        <button type="submit">Sign Up</button>
      </form>

      <div class="contact-info">
        <p>Already have an account? <a href="/signin" style="color: #5cb85c;">Sign In</a></p>
      </div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="custom-alert" id="customAlert">
                <div class="custom-alert-content">
                    <span class="custom-alert-icon">{{ '✓' if messages[0][0] == 'success' else '⚠' }}</span>
                    <p class="custom-alert-message">{{ messages[0][1] }}</p>
                </div>
            </div>
            <script type="text/javascript">
                window.onload = function() {
                    var alert = document.getElementById('customAlert');
                    alert.classList.add('show');
                    setTimeout(function() {
                        alert.classList.remove('show');
                    }, 3000);
                }
            </script>
        {% endif %}
    {% endwith %}

    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
